# Azure dev environment. Values resolve from env vars injected by CI / Databricks secrets.
env: dev
catalog: lakehouse_dev
schemas:
  bronze: bronze
  silver: silver
  gold: gold
storage:
  account: ${STORAGE_ACCOUNT:-stlakehousedev}
  container: lakehouse
  # root_path derives to abfss://lakehouse@<account>.dfs.core.windows.net
  checkpoint_path: abfss://lakehouse@${STORAGE_ACCOUNT:-stlakehousedev}.dfs.core.windows.net/_checkpoints
  quarantine_path: abfss://lakehouse@${STORAGE_ACCOUNT:-stlakehousedev}.dfs.core.windows.net/_quarantine
spark:
  shuffle_partitions: 64
  auto_optimize: true
maintenance:
  vacuum_retention_hours: 168   # 7 days - protects time travel + concurrent readers
  retention_check: true
monitoring:
  alert_emails:
    - data-eng-alerts@example.com
tags:
  environment: dev
  owner: data-engineering
  cost_center: analytics
