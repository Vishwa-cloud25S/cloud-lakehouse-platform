version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns: ["pytest*", "ruff", "black", "mypy*", "pre-commit", "types-*"]
    ignore:
      # pyspark and delta-spark must move together and must match the Databricks
      # Runtime. A lone major bump of either breaks the pairing, so these are
      # upgraded deliberately alongside a DBR upgrade, not automatically.
      - dependency-name: pyspark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: delta-spark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
