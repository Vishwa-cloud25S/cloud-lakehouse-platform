name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write   # to post the plan as a comment

jobs:
  plan:
    name: Plan ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Plan
        id: plan
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          ARM_USE_OIDC: true
        run: |
          cd infra/terraform
          terraform init -backend-config=envs/${{ matrix.env }}/backend.hcl
          terraform plan -var-file=envs/${{ matrix.env }}/terraform.tfvars -no-color -out=tfplan \
            | tee plan.txt
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          tail -c 60000 plan.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment the plan on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const body = `### Terraform plan — \`${{ matrix.env }}\`
            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.summary }}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
