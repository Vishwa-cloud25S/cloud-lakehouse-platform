name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  LAKEHOUSE_CONF_DIR: ${{ github.workspace }}/conf

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests scripts

      - name: Black
        run: black --check src tests

      - name: mypy
        run: mypy || true   # advisory: type coverage is being tightened incrementally

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache Ivy/Maven jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2
          key: ivy-${{ runner.os }}-delta-3.2.0

      - name: Unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest tests/unit -v --cov=src/lakehouse --cov-report=xml --cov-report=term-missing

      - name: Integration tests (real Delta lake)
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest tests/integration -v

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  e2e:
    name: End-to-end medallion run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Regenerate sample data
        # Start from a clean directory and use the same parameters as `make seed`,
        # so the run reproduces exactly the figures documented in the README
        # instead of layering new files on top of the committed samples.
        run: |
          rm -rf data/samples
          python scripts/generate_sample_data.py --out data/samples --days 14 --evolve

      - name: Run the full pipeline on Delta
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYTHONPATH: src
        run: python scripts/run_local_pipeline.py --env local --clean

      - name: Re-run to prove incremental processing is a no-op
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYTHONPATH: src
        run: python scripts/run_local_pipeline.py --env local --skip-maintenance

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra/terraform validate

  sql-lint:
    name: SQL sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every SQL file parses as non-empty and ends with a semicolon
        run: |
          fail=0
          for f in $(find sql -name '*.sql'); do
            if [ ! -s "$f" ]; then echo "::error file=$f::empty SQL file"; fail=1; fi
            if ! grep -q ';' "$f"; then echo "::error file=$f::no statement terminator"; fail=1; fi
          done
          exit $fail

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install build

      - run: python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: lakehouse-wheel
          path: dist/*.whl
          retention-days: 30
