name: Scheduled data quality report

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily, after the 02:00 pipeline run
  workflow_dispatch:

jobs:
  quality-report:
    name: Query DQ results and fail on SLA breach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - run: pip install databricks-sql-connector==3.4.0

      - name: Check quality + freshness SLAs
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID_PROD }}
        run: python scripts/check_quality_sla.py --env prod --min-pass-rate 0.95
