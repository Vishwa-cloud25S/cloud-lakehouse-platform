name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished deployment

permissions:
  id-token: write   # OIDC federated credentials - no long-lived secrets
  contents: read

jobs:
  # Cloud deployment requires Azure + Databricks secrets. Without them the
  # workflow reports "skipped" rather than a misleading red failure, so a fork or
  # a fresh clone shows an honest status.
  preflight:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.DATABRICKS_ACCOUNT_ID }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::Azure/Databricks secrets are not configured - skipping deployment."
          fi

  build:
    name: Build wheel
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: lakehouse-wheel
          path: dist/*.whl

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: needs.preflight.outputs.configured == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lakehouse-wheel
          path: dist

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform apply
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          ARM_USE_OIDC: true
        run: |
          cd infra/terraform
          terraform init -backend-config=envs/dev/backend.hcl
          terraform apply -auto-approve -var-file=envs/dev/terraform.tfvars

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version

      - name: Upload wheel to the workspace
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          databricks fs cp "$WHEEL" dbfs:/FileStore/wheels/lakehouse-latest-py3-none-any.whl --overwrite

      - name: Apply Unity Catalog governance
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          databricks sql query --warehouse-id ${{ secrets.DATABRICKS_WAREHOUSE_ID_DEV }} \
            --file sql/unity_catalog/01_catalog_setup.sql || true

      - name: Smoke test - run the pipeline job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          RUN=$(databricks jobs run-now --job-id ${{ secrets.DATABRICKS_JOB_ID_DEV }} --output json | jq -r '.run_id')
          echo "started run $RUN"
          databricks jobs get-run --run-id "$RUN" --output json | jq '.state'

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [preflight, deploy-dev]
    # GitHub environment protection rules provide the manual approval gate.
    environment:
      name: prod
    if: needs.preflight.outputs.configured == 'true' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lakehouse-wheel
          path: dist

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform plan
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          ARM_USE_OIDC: true
        run: |
          cd infra/terraform
          terraform init -backend-config=envs/prod/backend.hcl
          terraform plan -var-file=envs/prod/terraform.tfvars -out=prod.tfplan

      - name: Terraform apply
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          ARM_USE_OIDC: true
        run: cd infra/terraform && terraform apply -auto-approve prod.tfplan

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Promote the wheel
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          databricks fs cp "$WHEEL" dbfs:/FileStore/wheels/lakehouse-latest-py3-none-any.whl --overwrite
