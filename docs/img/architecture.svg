<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CD7F32"/><stop offset="100%" stop-color="#A0522D"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C6DB" stop-opacity="1"/><stop offset="100%" stop-color="#8A9BB0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C518"/><stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8DEF"/><stop offset="100%" stop-color="#3A6FD8"/>
    </linearGradient>
    <linearGradient id="bi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A33D"/><stop offset="100%" stop-color="#D4881F"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A5568"/>
    </marker>
    <marker id="arrowlite" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="860" fill="#F7F9FC"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#1A202C">cloud-lakehouse-platform</text>
  <text x="40" y="72" font-size="14" fill="#4A5568">Azure medallion lakehouse — ADLS Gen2 · PySpark · Delta Lake · Unity Catalog · Databricks SQL · Power BI</text>

  <!-- ============ GOVERNANCE BAND (spans everything) ============ -->
  <rect x="40" y="96" width="1200" height="54" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="60" y="121" font-size="14" font-weight="700" fill="#5B21B6">Unity Catalog governance</text>
  <text x="60" y="140" font-size="12" fill="#6D28D9">three-level namespace (catalog.schema.table) · grants per layer · column masking &amp; row filters · PII tags · automatic table + column lineage</text>
  <text x="1105" y="128" font-size="11" fill="#6D28D9" font-weight="600">applies to every layer →</text>

  <!-- ============ SOURCES ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="185" width="175" height="150" rx="10" fill="url(#src)"/>
  </g>
  <text x="127" y="212" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Sources</text>
  <text x="58" y="238" font-size="12" fill="#EAF1FF">• REST / Source APIs</text>
  <text x="58" y="258" font-size="12" fill="#EAF1FF">• CSV drops (SFTP)</text>
  <text x="58" y="278" font-size="12" fill="#EAF1FF">• CRM / catalogue</text>
  <text x="58" y="303" font-size="11" fill="#CBD9F5">orders · customers</text>
  <text x="58" y="320" font-size="11" fill="#CBD9F5">products</text>

  <!-- ============ ADLS LANDING ============ -->
  <g filter="url(#shadow)">
    <rect x="248" y="185" width="175" height="150" rx="10" fill="#1E3A5F"/>
  </g>
  <text x="335" y="212" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">ADLS Gen2</text>
  <text x="266" y="238" font-size="12" fill="#C7D9F0">Hierarchical namespace</text>
  <text x="266" y="258" font-size="12" fill="#C7D9F0">abfss:// landing zone</text>
  <text x="266" y="283" font-size="11" fill="#9FB8D8">Managed identity auth</text>
  <text x="266" y="300" font-size="11" fill="#9FB8D8">(Access Connector —</text>
  <text x="266" y="316" font-size="11" fill="#9FB8D8">no stored secrets)</text>

  <!-- ============ MEDALLION ============ -->
  <!-- BRONZE -->
  <g filter="url(#shadow)">
    <rect x="456" y="185" width="180" height="150" rx="10" fill="url(#bronze)"/>
  </g>
  <text x="546" y="212" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">BRONZE</text>
  <text x="474" y="236" font-size="11.5" fill="#FFF3E6">append-only · raw fidelity</text>
  <text x="474" y="256" font-size="11.5" fill="#FFF3E6">Auto Loader ingest</text>
  <text x="474" y="276" font-size="11.5" fill="#FFF3E6">provenance columns</text>
  <text x="474" y="299" font-size="11" fill="#FFE0C0">partitioned by _ingest_date</text>
  <text x="474" y="318" font-size="11" fill="#FFE0C0">schema registry v1..n</text>

  <!-- SILVER -->
  <g filter="url(#shadow)">
    <rect x="669" y="185" width="180" height="150" rx="10" fill="url(#silver)"/>
  </g>
  <text x="759" y="212" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle">SILVER</text>
  <text x="687" y="236" font-size="11.5" fill="#1F2937">typed · deduplicated</text>
  <text x="687" y="256" font-size="11.5" fill="#1F2937">quality gate + quarantine</text>
  <text x="687" y="276" font-size="11.5" fill="#1F2937">SCD2 history</text>
  <text x="687" y="299" font-size="11" fill="#374151">MERGE on row_hash</text>
  <text x="687" y="318" font-size="11" fill="#374151">partition-pruned upsert</text>

  <!-- GOLD -->
  <g filter="url(#shadow)">
    <rect x="882" y="185" width="180" height="150" rx="10" fill="url(#gold)"/>
  </g>
  <text x="972" y="212" font-size="16" font-weight="700" fill="#3B2F00" text-anchor="middle">GOLD</text>
  <text x="900" y="236" font-size="11.5" fill="#4A3B00">Kimball star schema</text>
  <text x="900" y="256" font-size="11.5" fill="#4A3B00">fact_orders + 3 dims</text>
  <text x="900" y="276" font-size="11.5" fill="#4A3B00">serving aggregates</text>
  <text x="900" y="299" font-size="11" fill="#5C4A00">point-in-time joins</text>
  <text x="900" y="318" font-size="11" fill="#5C4A00">partitioned by month</text>

  <!-- CONSUMERS -->
  <g filter="url(#shadow)">
    <rect x="1095" y="185" width="145" height="150" rx="10" fill="url(#bi)"/>
  </g>
  <text x="1167" y="212" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Serving</text>
  <text x="1112" y="238" font-size="12" fill="#FFF2DF">Databricks SQL</text>
  <text x="1112" y="258" font-size="12" fill="#FFF2DF">Power BI</text>
  <text x="1112" y="283" font-size="11" fill="#FFE3BF">bi.* view layer</text>
  <text x="1112" y="300" font-size="11" fill="#FFE3BF">Photon warehouse</text>
  <text x="1112" y="317" font-size="11" fill="#FFE3BF">auto-stop 10 min</text>

  <!-- flow arrows -->
  <line x1="215" y1="260" x2="244" y2="260" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="423" y1="260" x2="452" y2="260" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="636" y1="260" x2="665" y2="260" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="849" y1="260" x2="878" y2="260" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1062" y1="260" x2="1091" y2="260" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="530" y="176" font-size="10.5" fill="#64748B">incremental</text>
  <text x="700" y="176" font-size="10.5" fill="#64748B">PySpark transforms</text>
  <text x="905" y="176" font-size="10.5" fill="#64748B">dimensional model</text>

  <!-- ============ PYSPARK ENGINE BAND ============ -->
  <rect x="456" y="358" width="606" height="86" rx="8" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="476" y="382" font-size="13" font-weight="700" fill="#075985">PySpark on Databricks (Delta Lake ACID)</text>
  <text x="476" y="403" font-size="11.5" fill="#0C6E96">Adaptive Query Execution · skew-join handling · optimizeWrite + autoCompact · broadcast dimension joins</text>
  <text x="476" y="422" font-size="11.5" fill="#0C6E96">OPTIMIZE / Z-ORDER / VACUUM / ANALYZE · deletion vectors · Change Data Feed · time travel</text>
  <line x1="546" y1="335" x2="546" y2="354" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowlite)"/>
  <line x1="759" y1="335" x2="759" y2="354" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowlite)"/>
  <line x1="972" y1="335" x2="972" y2="354" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowlite)"/>

  <!-- ============ CONTROL PLANE ============ -->
  <rect x="40" y="470" width="600" height="176" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="496" font-size="14" font-weight="700" fill="#1A202C">Control plane — ops schema (Delta)</text>

  <rect x="60" y="510" width="130" height="52" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="125" y="530" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">watermarks</text>
  <text x="125" y="548" font-size="10" fill="#64748B" text-anchor="middle">incremental state</text>

  <rect x="200" y="510" width="130" height="52" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="265" y="530" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">schema_registry</text>
  <text x="265" y="548" font-size="10" fill="#64748B" text-anchor="middle">versioned schemas</text>

  <rect x="340" y="510" width="130" height="52" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="405" y="530" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">dq_results</text>
  <text x="405" y="548" font-size="10" fill="#64748B" text-anchor="middle">rule outcomes</text>

  <rect x="480" y="510" width="130" height="52" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="545" y="530" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">quarantine</text>
  <text x="545" y="548" font-size="10" fill="#64748B" text-anchor="middle">rejected rows</text>

  <rect x="60" y="574" width="200" height="52" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="160" y="594" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">pipeline_metrics</text>
  <text x="160" y="612" font-size="10" fill="#64748B" text-anchor="middle">rows · duration · status per stage</text>

  <rect x="270" y="574" width="160" height="52" rx="6" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="350" y="594" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">lineage</text>
  <text x="350" y="612" font-size="10" fill="#64748B" text-anchor="middle">job-level edges</text>

  <rect x="440" y="574" width="170" height="52" rx="6" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="525" y="594" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">alerts</text>
  <text x="525" y="612" font-size="10" fill="#B45309" text-anchor="middle">freshness · volume · quality</text>

  <!-- ============ CI/CD + IaC ============ -->
  <rect x="664" y="470" width="576" height="176" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="684" y="496" font-size="14" font-weight="700" fill="#1A202C">CI/CD &amp; Infrastructure as Code</text>

  <rect x="684" y="510" width="166" height="52" rx="6" fill="#ECFDF5" stroke="#10B981"/>
  <text x="767" y="530" font-size="11.5" font-weight="600" fill="#065F46" text-anchor="middle">GitHub Actions</text>
  <text x="767" y="548" font-size="10" fill="#047857" text-anchor="middle">lint · test · e2e · build</text>

  <rect x="862" y="510" width="166" height="52" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="945" y="530" font-size="11.5" font-weight="600" fill="#1E40AF" text-anchor="middle">Terraform</text>
  <text x="945" y="548" font-size="10" fill="#1D4ED8" text-anchor="middle">ADLS · UC · jobs · budget</text>

  <rect x="1040" y="510" width="184" height="52" rx="6" fill="#FDF2F8" stroke="#EC4899"/>
  <text x="1132" y="530" font-size="11.5" font-weight="600" fill="#9D174D" text-anchor="middle">OIDC federated auth</text>
  <text x="1132" y="548" font-size="10" fill="#BE185D" text-anchor="middle">no long-lived secrets</text>

  <rect x="684" y="574" width="540" height="52" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="704" y="594" font-size="11.5" font-weight="600" fill="#334155">PR → plan comment → merge → dev apply → manual gate → prod apply</text>
  <text x="704" y="612" font-size="10" fill="#64748B">wheel built once and promoted; job clusters run it via python_wheel_task</text>

  <!-- ============ COST BAND ============ -->
  <rect x="40" y="668" width="1200" height="70" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="60" y="692" font-size="13" font-weight="700" fill="#166534">Cost controls</text>
  <text x="60" y="712" font-size="11.5" fill="#15803D">Job clusters (not all-purpose) · spot workers with on-demand driver · autoscale 1→N · cluster policy caps · warehouse auto-stop</text>
  <text x="60" y="730" font-size="11.5" fill="#15803D">Bronze lifecycle tiering Hot→Cool→Archive · partition-pruned MERGE · incremental-only reads · forecast budget alerts</text>

  <!-- ============ FOOTER LEGEND ============ -->
  <text x="40" y="768" font-size="11.5" font-weight="700" fill="#475569">Data flow guarantees</text>
  <text x="40" y="788" font-size="11" fill="#64748B">Idempotent — re-running any job produces the same result (MERGE on business keys + watermark state).</text>
  <text x="40" y="806" font-size="11" fill="#64748B">Incremental — each run reads only new files/rows; a failed run resumes from the last committed watermark.</text>
  <text x="40" y="824" font-size="11" fill="#64748B">Replayable — Bronze retains raw fidelity, so any downstream bug is fixed by reprocessing, not re-ingesting.</text>
  <text x="40" y="842" font-size="11" fill="#64748B">Observable — every stage emits JSON logs, Delta metrics and lineage edges under one correlated run_id.</text>
</svg>
